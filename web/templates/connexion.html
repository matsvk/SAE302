<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Suivi de flotte</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/commun.js" defer></script>
    <script src="/static/js/connexion.js" defer></script>
</head>
<body class="page-auth">
<main class="centre">
    <div class="carte-auth">
        <div class="logo"><svg class="logo-icone" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1f4f8f"/><path d="M7 11h11v9H7zM18 14h4l3 3v3h-7z" fill="#fff"/><circle cx="11" cy="21.5" r="2" fill="#1f4f8f" stroke="#fff" stroke-width="1.5"/><circle cx="21.5" cy="21.5" r="2" fill="#1f4f8f" stroke="#fff" stroke-width="1.5"/></svg> Suivi de flotte</div>

        <h1>Connexion</h1>
        <p class="sous-titre">Accédez au suivi en temps réel de votre flotte.</p>

        <form id="formulaire" novalidate>
            <label for="email">Adresse e-mail</label>
            <input id="email" name="email" type="email" autocomplete="username"
                   autocapitalize="none" spellcheck="false" maxlength="254" required>

            <label for="mot_de_passe">Mot de passe</label>
            <input id="mot_de_passe" name="mot_de_passe" type="password"
                   autocomplete="current-password" maxlength="200" required>

            <p id="message" class="message erreur" role="alert" hidden></p>

            <button type="submit" id="bouton">Se connecter</button>
        </form>

        <p class="separation">Pas de compte ou mot de passe oublié ?<br>
            Contactez le gestionnaire de votre flotte.</p>
    </div>
    <p class="pied">Suivi de flotte · SAÉ 3.02 – IUT de Villetaneuse</p>
</main>
</body>
</html>
